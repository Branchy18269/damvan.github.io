<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000000; /* Fully black background */
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: white;
        }

        /* Starfield Animation */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 1; /* Brighter stars */
            box-shadow: 0 0 4px 1px rgba(255, 255, 255, 0.3); /* Subtle glow for brightness */
            animation: moveStar linear infinite;
        }

        @keyframes moveStar {
            from { transform: translateY(-10vh); }
            to { transform: translateY(110vh); }
        }

        /* Rocket Styling */
        .rocket-container {
            position: relative;
            z-index: 10;
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-1deg); }
            40% { transform: translate(-3px, 0px) rotate(1deg); }
            60% { transform: translate(3px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        /* Flame Animation - Positioned behind via HTML order and z-index */
        .flame {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 50px;
            background: linear-gradient(to bottom, #ff5f6d, #ffc371);
            border-radius: 50% 50% 20% 20%;
            filter: blur(2px);
            animation: flicker 0.1s infinite alternate;
            z-index: -1;
        }

        @keyframes flicker {
            0% { height: 40px; opacity: 0.8; }
            100% { height: 60px; opacity: 1; }
        }

        /* Content Box */
        .content-box {
            text-align: center;
            margin-top: 40px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.05); /* Slightly lighter box for contrast on black */
            padding: 2rem;
            border-radius: 1.5rem;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Countdown Circle */
        .countdown-circle {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem auto;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .countdown-circle::before {
            content: '';
            position: absolute;
            inset: -3px;
            border: 3px solid transparent;
            border-top: 3px solid #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .no-spin::before {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="starfield"></div>

    <div class="rocket-container" id="rocket">
        <div class="flame"></div>
        <svg width="60" height="100" viewBox="0 0 60 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 0C30 0 10 30 10 60V85H50V60C50 30 30 0 30 0Z" fill="#E2E8F0"/>
            <path d="M10 65L0 85H10V65Z" fill="#94A3B8"/>
            <path d="M50 65L60 85H50V65Z" fill="#94A3B8"/>
            <circle cx="30" cy="35" r="8" fill="#334155"/>
            <circle cx="28" cy="33" r="3" fill="#94A3B8" fill-opacity="0.5"/>
        </svg>
    </div>

    <div class="content-box">
        <h1 class="text-3xl font-bold mb-2">Engaging hyperdrive...</h1>
        <p class="text-slate-400">now shifting to DRTC.net</p>
        
        <div class="countdown-circle" id="spinner">
            <span id="timer" class="relative z-10">5</span>
        </div>

        <button onclick="redirectNow()" class="mt-4 text-sm text-blue-400 hover:text-blue-300 transition-colors">
            Click here if you aren't redirected automatically
        </button>
    </div>

    <script>
        const targetURL = "https://drtc.net";
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');
        const starfield = document.getElementById('starfield');
        const rocket = document.getElementById('rocket');

        function createStars() {
            const starCount = 150;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const size = Math.random() * 3;
                const duration = Math.random() * 0.8 + 0.4; // Slightly faster for energy
                const delay = Math.random() * 2;

                star.style.left = `${x}vw`;
                star.style.top = `-${y}vh`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.animationDuration = `${duration}s`;
                star.style.animationDelay = `${delay}s`;

                starfield.appendChild(star);
            }
        }

        function redirectNow() {
            window.location.href = targetURL;
        }

        createStars();

        const countdownInterval = setInterval(() => {
            timeLeft -= 1;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 1) {
                rocket.style.animationDuration = '0.05s';
            }

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                timerElement.textContent = "🚀";
                document.getElementById('spinner').classList.add('no-spin');
                
                rocket.style.transition = "transform 0.5s ease-in";
                rocket.style.transform = "translateY(-150vh)";
                
                setTimeout(redirectNow, 500);
            }
        }, 1000);
    </script>
</body>
</html>
